name: Deploy Web App to Azure App Service

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - '.github/workflows/deploy-web-app.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Build shared packages
        run: |
          cd packages/types && npm ci && npm run build
          cd ../utils && npm ci && npm run build || true

      - name: Build Web App
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://okr-nexus-api-gateway.azurewebsites.net' }}
        run: |
          npm ci
          # Ensure ts-node is available in PATH
          export PATH="$PWD/node_modules/.bin:$PATH"
          # Build
          npm run build

      - name: Create deployment package
        working-directory: apps/web
        run: |
          # Create a temporary directory for the package
          TEMP_DIR=$(mktemp -d)
          
          echo "Flattening deployment artifact..."
          
          # 1. Copy shared node_modules from standalone root
          echo "Copying shared dependencies..."
          cp -r .next/standalone/node_modules "$TEMP_DIR/"
          
          # 2. Copy app-specific node_modules (merging with shared)
          echo "Merging app dependencies..."
          cp -r .next/standalone/apps/web/node_modules/* "$TEMP_DIR/node_modules/"
          
          # 3. Copy server.js and server-custom.js to root
          echo "Copying server files..."
          cp .next/standalone/apps/web/server.js "$TEMP_DIR/"
          cp server-custom.js "$TEMP_DIR/"
          
          # 4. Copy .next directory to root
          echo "Copying .next directory..."
          cp -r .next/standalone/apps/web/.next "$TEMP_DIR/"
          
          # 5. Copy static assets to .next/static
          echo "Copying static assets..."
          mkdir -p "$TEMP_DIR/.next/static"
          if [ -d ".next/static" ]; then
            cp -r .next/static/* "$TEMP_DIR/.next/static/"
          else
            echo "⚠ Warning: .next/static directory not found"
            exit 1
          fi
          
          # 6. Copy public directory to root
          echo "Copying public directory..."
          if [ -d "public" ]; then
            mkdir -p "$TEMP_DIR/public"
            cp -r public/* "$TEMP_DIR/public/" 2>/dev/null || true
          fi
          
          # Verify structure
          echo "Verifying flattened structure..."
          ls -la "$TEMP_DIR"
          echo "Checking for critical files:"
          [ -f "$TEMP_DIR/server.js" ] && echo "✓ server.js found" || echo "❌ server.js missing"
          [ -f "$TEMP_DIR/server-custom.js" ] && echo "✓ server-custom.js found" || echo "❌ server-custom.js missing"
          [ -d "$TEMP_DIR/node_modules/next" ] && echo "✓ next dependency found" || echo "❌ next dependency missing"
          [ -d "$TEMP_DIR/.next/static" ] && echo "✓ static assets found" || echo "❌ static assets missing"
          
          # Create ZIP from temp directory
          cd "$TEMP_DIR"
          zip -r ../release.zip .
          cd -
          mv "$TEMP_DIR/../release.zip" ./release.zip
          rm -rf "$TEMP_DIR"

      - name: Deploy to Azure Web App using Kudu API
        run: |
          APP_NAME="okr-nexus-web"
          DEPLOY_USER="${{ secrets.AZURE_DEPLOY_USERNAME }}"
          DEPLOY_PASS="${{ secrets.AZURE_DEPLOY_PASSWORD }}"
          
          # Deploy using Kudu Zip Deploy API
          curl -X POST \
            -u "${DEPLOY_USER}:${DEPLOY_PASS}" \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy" \
            --data-binary @"apps/web/release.zip" \
            --header "Content-Type: application/zip"
          
          # Set working directory and startup command via Azure CLI
          # Now we can just run node server.js from the root
          az webapp config set \
            --name "${APP_NAME}" \
            --resource-group "vibe-code-test" \
            --startup-file "node server-custom.js" \
            --output none || echo "Note: Startup command may need to be set manually"

