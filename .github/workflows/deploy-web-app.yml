name: Deploy Web App to Azure App Service

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'packages/utils/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Build shared packages
        run: |
          cd packages/types && npm ci && npm run build
          cd ../utils && npm ci && npm run build || true

      - name: Build Web App
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://okr-nexus-api-gateway.azurewebsites.net' }}
        run: |
          npm ci
          # Ensure ts-node is available in PATH
          export PATH="$PWD/node_modules/.bin:$PATH"
          # Build
          npm run build

      - name: Create deployment package
        working-directory: apps/web
        run: |
          # Create a temporary directory for the package
          TEMP_DIR=$(mktemp -d)
          
          # Copy standalone build
          cp -r .next/standalone/* "$TEMP_DIR/"
          
          # Copy static files - Next.js serves from /_next/static/ but needs files at .next/static/ relative to server.js
          # Since server.js is at apps/web/server.js, static files should be at apps/web/.next/static/
          if [ -d ".next/static" ]; then
            mkdir -p "$TEMP_DIR/apps/web/.next/static"
            cp -r .next/static/* "$TEMP_DIR/apps/web/.next/static/"
            echo "✓ Copied static files to apps/web/.next/static/"
            ls -la "$TEMP_DIR/apps/web/.next/static/" | head -10
          else
            echo "⚠ Warning: .next/static directory not found"
          fi
          
          # Copy public directory
          if [ -d "public" ]; then
            mkdir -p "$TEMP_DIR/apps/web/public"
            cp -r public/* "$TEMP_DIR/apps/web/public/" 2>/dev/null || true
            echo "✓ Copied public files"
          fi
          
          # Verify structure
          echo "Verifying deployment structure..."
          echo "Server.js location:"
          find "$TEMP_DIR" -name "server.js" -type f
          echo "Static files location:"
          find "$TEMP_DIR" -path "*/static/chunks/*" -type f | head -5 || echo "No static chunks found!"
          
          # Create ZIP from temp directory
          cd "$TEMP_DIR"
          zip -r ../release.zip .
          cd -
          mv "$TEMP_DIR/../release.zip" ./release.zip
          rm -rf "$TEMP_DIR"

      - name: Deploy to Azure Web App using Kudu API
        run: |
          APP_NAME="okr-nexus-web"
          DEPLOY_USER="${{ secrets.AZURE_DEPLOY_USERNAME }}"
          DEPLOY_PASS="${{ secrets.AZURE_DEPLOY_PASSWORD }}"
          
          # Deploy using Kudu Zip Deploy API
          curl -X POST \
            -u "${DEPLOY_USER}:${DEPLOY_PASS}" \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy" \
            --data-binary @"apps/web/release.zip" \
            --header "Content-Type: application/zip"
          
          # Set working directory and startup command via Azure CLI
          az webapp config set \
            --name "${APP_NAME}" \
            --resource-group "vibe-code-test" \
            --startup-file "node apps/web/server.js" \
            --output none || echo "Note: Startup command may need to be set manually"

