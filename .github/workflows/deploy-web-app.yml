name: Deploy Web App to Azure App Service

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - '.github/workflows/deploy-web-app.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://okr-nexus-api-gateway.azurewebsites.net' }}
        run: |
          # Build shared packages first
          pnpm --filter @okr-nexus/types build
          pnpm --filter @okr-nexus/utils build
          
          # Build web app
          pnpm --filter @okr-nexus/web build

      - name: Create deployment package
        run: |
          # Create a temporary directory for the package using pnpm deploy
          # This creates a fully isolated production build with correct node_modules
          pnpm --filter @okr-nexus/web --prod deploy deploy_dist
          
          # Copy build artifacts that pnpm deploy might miss (since they are in .next)
          echo "Copying build artifacts..."
          # cp -r apps/web/.next deploy_dist/
          # cp -r apps/web/public deploy_dist/
          
          # Copy our custom server
          echo "Copying custom server..."
          cp apps/web/server-custom.js deploy_dist/
          
          # Verify structure
          echo "Verifying deployment structure..."
          ls -la deploy_dist
          echo "Checking for critical files:"
          [ -f "deploy_dist/server-custom.js" ] && echo "✓ server-custom.js found" || echo "❌ server-custom.js missing"
          # [ -d "deploy_dist/node_modules" ] && echo "✓ node_modules found" || echo "❌ node_modules missing"
          # [ -d "deploy_dist/.next/static" ] && echo "✓ static assets found" || echo "❌ static assets missing"
          
          # Create ZIP from deploy directory
          cd deploy_dist
          zip -r ../release.zip .
          cd -
          rm -rf deploy_dist

      - name: Deploy to Azure Web App using Kudu API
        run: |
          APP_NAME="okr-nexus-web"
          DEPLOY_USER="${{ secrets.AZURE_DEPLOY_USERNAME }}"
          DEPLOY_PASS="${{ secrets.AZURE_DEPLOY_PASSWORD }}"
          
          # Deploy using Kudu Zip Deploy API
          curl -X POST \
            -u "${DEPLOY_USER}:${DEPLOY_PASS}" \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy" \
            --data-binary @"release.zip" \
            --header "Content-Type: application/zip"
          
          # Set working directory and startup command via Azure CLI
          az webapp config set \
            --name "${APP_NAME}" \
            --resource-group "vibe-code-test" \
            --startup-file "node server-custom.js" \
            --output none || echo "Note: Startup command may need to be set manually"

