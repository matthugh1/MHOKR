name: Deploy Core API to Azure App Service

on:
  push:
    paths:
      - 'services/core-api/**'
      - 'packages/types/**'
      - 'packages/utils/**'
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Generate Prisma Client
        working-directory: services/core-api
        run: npx prisma generate

      - name: Build Core API
        working-directory: services/core-api
        run: npm run build

      - name: Create deployment package
        working-directory: services/core-api/dist
        run: |
          # Zip the contents of dist folder (not the folder itself)
          # This ensures main.js is at the root of the zip
          zip -r ../release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'okr-nexus-core-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'services/core-api/release.zip'

