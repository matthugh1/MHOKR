name: Deploy to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'azure/appservice/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all services'
        required: false
        default: true
        type: boolean

env:
  AZURE_RESOURCE_GROUP: vibe-code-test
  APP_NAME_PREFIX: okr-nexus
  APP_SERVICE_PLAN_NAME: okr-nexus-plan
  LOCATION: uksouth

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Create .env file for scripts
        run: |
          cat > azure/appservice/.env << EOF
          RESOURCE_GROUP=${{ env.AZURE_RESOURCE_GROUP }}
          LOCATION=${{ env.LOCATION }}
          APP_NAME_PREFIX=${{ env.APP_NAME_PREFIX }}
          APP_SERVICE_PLAN_NAME=${{ env.APP_SERVICE_PLAN_NAME }}
          NEXT_PUBLIC_API_URL=https://${{ env.APP_NAME_PREFIX }}-api-gateway.azurewebsites.net
          EOF

      - name: Make scripts executable
        run: chmod +x azure/appservice/*.sh

      - name: Generate Prisma Client
        run: pnpm --filter @okr-nexus/core-api run prisma:generate

      - name: Build all services
        run: ./azure/appservice/build-services.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: azure/appservice/build/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: azure/appservice/build

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create .env file for scripts
        run: |
          cat > azure/appservice/.env << EOF
          RESOURCE_GROUP=${{ env.AZURE_RESOURCE_GROUP }}
          LOCATION=${{ env.LOCATION }}
          APP_NAME_PREFIX=${{ env.APP_NAME_PREFIX }}
          APP_SERVICE_PLAN_NAME=${{ env.APP_SERVICE_PLAN_NAME }}
          NEXT_PUBLIC_API_URL=https://${{ env.APP_NAME_PREFIX }}-api-gateway.azurewebsites.net
          EOF

      - name: Make scripts executable
        run: chmod +x azure/appservice/*.sh

      - name: Deploy Backend Services
        run: ./azure/appservice/deploy-backend.sh

      - name: Deploy Web App
        run: ./azure/appservice/deploy-web.sh
